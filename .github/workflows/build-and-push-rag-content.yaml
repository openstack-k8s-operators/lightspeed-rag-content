name: "Build and push rag-content container image"

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  schedule:
    - cron: '15 02 * * *'

env:
  OS_VERSION: 2026.1

jobs:
  prepare-build-config:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.config.outputs.tags }}
      build_args: ${{ steps.config.outputs.build_args }}
    steps:
      - name: Compute tags and build args
        id: config
        shell: bash
        run: |
          OS_PROJECTS=""
          OS_API_DOCS="false"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Build only partial rag-content in the check pipeline
            OS_PROJECTS="nova"
            OS_API_DOCS="true"
          fi

          INDEX_NAME="os-docs-${{ env.OS_VERSION }}-ogx"

          # For periodic nightly builds, use nightly-YYYYMMDD and os-docs-<version>
          # tags to avoid overwriting commit-based tags.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TAGS="nightly-$(date -u +'%Y%m%d') ${INDEX_NAME}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAGS="${{ github.sha }} ${INDEX_NAME}"
          else
            # Safe default for manual/PR builds.
            TAGS="backup"
          fi

          {
            echo "tags=${TAGS}"
            echo "build_args<<EOF"
            echo "FLAVOR=cpu"
            echo "NUM_WORKERS=4"
            echo "OS_PROJECTS=${OS_PROJECTS}"
            echo "OS_VERSION=${{ env.OS_VERSION }}"
            echo "INDEX_NAME=${INDEX_NAME}"
            echo "DOCS_LINK_UNREACHABLE_ACTION=fail"
            echo "OS_API_DOCS=${OS_API_DOCS}"
            echo "VECTOR_DB_TYPE=llamastack-faiss"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-and-push-rag-content:
    needs: prepare-build-config
    uses: openstack-k8s-operators/lightspeed-mcps/.github/workflows/build-and-push-mcps.yaml@main
    with:
      image_namespace: openstack-lightspeed
      build_context: .
      containerfile: ./Containerfile
      prefetch_artifacts: true
      artifacts_file: ./.s2i/artifacts.txt
      artifacts_script: ./.s2i/get_artifacts.sh
      tags: ${{ needs.prepare-build-config.outputs.tags }}
      build_args: ${{ needs.prepare-build-config.outputs.build_args }}
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_IO_LOGIN }}
      QUAY_PASSWORD: ${{ secrets.QUAY_IO_PASSWORD }}

  sign-images:
    needs:
      - prepare-build-config
      - build-and-push-rag-content
    if: github.event_name == 'schedule' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Log in to quay.io
        uses: redhat-actions/podman-login@v2
        with:
          username: ${{ secrets.QUAY_IO_LOGIN }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
          registry: quay.io

      - name: Sign pushed image tags
        env:
          IMAGE_NAME: quay.io/openstack-lightspeed/${{ github.event.repository.name }}
          TAGS: ${{ needs.prepare-build-config.outputs.tags }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_KEY_PASSWORD }}
        shell: bash
        run: |
          for tag in ${TAGS}; do
            DIGEST=$(skopeo inspect docker://${IMAGE_NAME}:${tag} | jq -r '.Digest')
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY ${IMAGE_NAME}@${DIGEST}
          done
