---
name: Pre-commit

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/checkout@v7
      - uses: pre-commit/action@v3.0.1
